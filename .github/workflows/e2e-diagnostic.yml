name: E2E browser diagnostics

# Runs the redacted browser diagnostic (e2e/diagnose-hydration.mjs) and, when
# the disposable-project secrets are configured, the full 19-journey E2E
# suite. The diagnostic job needs NO secrets: it runs the app against dummy
# Supabase values and never contacts a real project. The e2e job refuses to
# run unless E2E_SUPABASE_URL points at the disposable project
# (ssvwzakelcumisccsuly) — production is never a valid target.

on:
  workflow_dispatch:
  push:
    branches: [arena/d85f71d8-fantasy-friends-rec]

concurrency:
  group: e2e-diag-${{ github.ref }}
  cancel-in-progress: true

# The runner posts the REDACTED outputs as PR comments: artifact/log download
# endpoints are unreachable from the diagnostics sandbox, PR comments are API.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    name: Hydration diagnostic (dev + prod, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start dev server (dummy Supabase env — diagnostic does not contact it)
        run: |
          printf '%s\n' \
            'NEXT_PUBLIC_SUPABASE_URL=https://ssvwzakelcumisccsuly.supabase.co' \
            'NEXT_PUBLIC_SUPABASE_ANON_KEY=diagnostic-dummy-not-a-real-key' \
            'SUPABASE_SERVICE_ROLE_KEY=diagnostic-dummy-not-a-real-key' \
            > .env.local
          nohup npm run dev -- --port 3000 > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "dev server never answered"; tail -50 dev-server.log; exit 1

      - name: Run diagnostic against dev server (control, current config)
        run: node e2e/diagnose-hydration.mjs | tee diagnostic-dev.json

      # Isolation experiment 1: same server, same config, page origin
      # localhost instead of 127.0.0.1. localhost IS in the dev cross-site
      # allowlist, so the HMR/debug WebSocket handshake is not 403'd.
      - name: Run diagnostic against dev server via localhost origin
        run: E2E_BASE_URL=http://localhost:3000 node e2e/diagnose-hydration.mjs | tee diagnostic-dev-localhost.json

      # Isolation experiment 2: patch next.config IN CI ONLY (not committed)
      # with allowedDevOrigins: ["127.0.0.1"], restart, retest at 127.0.0.1.
      # If this hydrates, the WS 403 is proven to be the hydration killer and
      # allowedDevOrigins is the evidence-backed fix.
      - name: Run diagnostic with in-CI allowedDevOrigins patch
        run: |
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 2
          sed -i 's/^} : {/} : {\n  allowedDevOrigins: ["127.0.0.1"],/' next.config.ts
          grep -n "allowedDevOrigins" next.config.ts
          nohup npm run dev -- --port 3000 > dev-server-patched.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          node e2e/diagnose-hydration.mjs | tee diagnostic-dev-allowed-origins.json
          git checkout -- next.config.ts

      - name: Build production bundle and run diagnostic against prod server
        run: |
          git checkout -- next.config.ts || true
          npm run build > build.log 2>&1 || { tail -40 build.log; exit 1; }
          nohup npm run start -- --port 3001 > prod-server.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/login || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          E2E_BASE_URL=http://127.0.0.1:3001 node e2e/diagnose-hydration.mjs | tee diagnostic-prod.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydration-diagnostic
          path: |
            diagnostic-dev.json
            diagnostic-dev-localhost.json
            diagnostic-dev-allowed-origins.json
            diagnostic-prod.json
            dev-server.log
            dev-server-patched.log
            prod-server.log
            build.log
          if-no-files-found: warn

      - name: Publish redacted diagnostic output to PR #41
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const files = [
              ["diagnostic-dev.json", "control: dev @127.0.0.1, current config"],
              ["diagnostic-dev-localhost.json", "experiment 1: dev @localhost, current config"],
              ["diagnostic-dev-allowed-origins.json", "experiment 2: dev @127.0.0.1 + in-CI allowedDevOrigins patch"],
              ["diagnostic-prod.json", "reference: production build @127.0.0.1"],
            ];
            let body = `### Hydration diagnostic — run ${context.runId} (${context.sha.slice(0, 7)})\n\n`;
            body += "| scenario | page | inline JS | runtime | scripts loaded | CSP violations | page errors | WS errors | hydration | submit |\n";
            body += "|---|---|---|---|---|---|---|---|---|---|\n";
            for (const [f, label] of files) {
              if (!fs.existsSync(f)) { body += `| ${label} | — | file missing |\n`; continue; }
              let arr; try { arr = JSON.parse(fs.readFileSync(f, "utf8")); } catch { body += `| ${label} | — | unparsable |\n`; continue; }
              for (const sc of arr) {
                const ws = (sc.console || []).filter((l) => l.includes("WebSocket")).length;
                const hyd = sc.hydrationProbe.startsWith("HYDRATED") ? "**HYDRATED**" : "NOT HYDRATED";
                body += `| ${label} | ${sc.scenario} | ${sc.inlineScriptsExecuted} | ${sc.runtimeChunkExecuted} | ${(sc.scriptEvents || []).length} | ${(sc.cspViolations || []).length} | ${(sc.pageErrors || []).length} | ${ws} | ${hyd} | ${String(sc.submitProbe).slice(0, 60)} |\n`;
              }
            }
            body += "\nFull redacted JSON is in the `hydration-diagnostic` workflow artifact. No bodies, cookies, tokens or credentials are captured.\n";
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 41, body });

  e2e:
    name: Full 19-journey E2E (requires disposable-project secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: diagnose
    env:
      CI: "true"
      SECRET_URL_A: ${{ secrets.E2E_SUPABASE_URL }}
      SECRET_URL_B: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SECRET_SERVICE: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      SECRET_SERVICE_B: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SECRET_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SECRET_PW: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and guard disposable-project credentials
        run: |
          U="${SECRET_URL_A:-$SECRET_URL_B}"
          S="${SECRET_SERVICE:-$SECRET_SERVICE_B}"
          UP=$([ -n "$U" ] && echo yes || echo no)
          SP=$([ -n "$S" ] && echo yes || echo no)
          AP=$([ -n "$SECRET_ANON" ] && echo yes || echo no)
          echo "E2E_SUPABASE_URL present: $UP"
          echo "service role key present: $SP"
          echo "anon key present: $AP"
          if [ -z "$U" ] || [ -z "$S" ] || [ -z "$SECRET_ANON" ]; then
            {
              echo "credential guard: url=$UP service=$SP anon=$AP"
              echo "status: BLOCKED — secrets not configured"
            } > guard-result.txt
            echo "::error::BLOCKED — GitHub Actions secrets are not configured. Need E2E_SUPABASE_URL, E2E_SUPABASE_SERVICE_ROLE_KEY (or SUPABASE_SERVICE_ROLE_KEY) and NEXT_PUBLIC_SUPABASE_ANON_KEY of the DISPOSABLE project ssvwzakelcumisccsuly. The 19-journey suite cannot authenticate without them; no result is fabricated."
            exit 1
          fi
          # Hard refusals first: the production ref is never an acceptable value.
          case "$U" in
            *zkrfgdiujpagaddsxbcb*)
              echo "status: REFUSED — production project reference detected" > guard-result.txt
              echo "::error::REFUSED — production project reference detected."
              exit 1 ;;
          esac
          # Canonicalize the configured URL to the disposable project's bare
          # origin. Connection settings are commonly copied WITH an API path
          # (…/rest/v1/) or a trailing slash; both unambiguously name the same
          # project, so the canonical form is derived here. Anything that is
          # not https on the disposable host is refused. The value itself is
          # never printed — only shape booleans.
          case "$U" in
            https://ssvwzakelcumisccsuly.supabase.co|https://ssvwzakelcumisccsuly.supabase.co/*)
              CANON="https://ssvwzakelcumisccsuly.supabase.co"
              if [ "$U" = "$CANON" ]; then CANON_NOTE="already canonical"; else CANON_NOTE="normalized to bare origin (path/trailing slash dropped)"; fi
              ;;
            *)
              {
                echo "credential guard: url=$UP service=$SP anon=$AP"
                echo "status: REFUSED — URL is not https on host ssvwzakelcumisccsuly.supabase.co"
              } > guard-result.txt
              echo "::error::REFUSED — the configured Supabase URL is not https://ssvwzakelcumisccsuly.supabase.co (an API path like /rest/v1 is fine). Never run E2E against production."
              exit 1 ;;
          esac
          {
            echo "credential guard: url=$UP service=$SP anon=$AP"
            echo "disposable-guard: PASS ($CANON_NOTE)"
          } > guard-result.txt
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$CANON"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SECRET_ANON"
            echo "SUPABASE_SERVICE_ROLE_KEY=$S"
          } > .env.local
          echo "E2E_SUPABASE_URL=$CANON" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$S" >> "$GITHUB_ENV"
          [ -n "$SECRET_PW" ] && echo "E2E_USER_PASSWORD=$SECRET_PW" >> "$GITHUB_ENV" || true

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run all 19 journeys (dev server auto-started by Playwright webServer)
        run: |
          # pipefail: without it the pipeline exits with tee's status and a
          # failing Playwright run would be reported as a green job.
          set -o pipefail
          npx playwright test 2>&1 | tee playwright-run.log

      - name: Prepare redacted E2E report (secrets stripped)
        if: always()
        run: |
          {
            echo "### E2E suite — run ${GITHUB_RUN_ID}"
            echo
            [ -f guard-result.txt ] && { echo "**Credential guard:**"; echo; echo '```'; cat guard-result.txt; echo '```'; echo; }
            if [ -f playwright-run.log ]; then
              echo "**Playwright totals:**"; echo; echo '```'
              grep -E "^[[:space:]]*[0-9]+ (passed|failed|skipped|did not run|flaky)" playwright-run.log || echo "(no totals line found — suite may not have completed)"
              echo '```'; echo
            fi
            echo '```'
            [ -f playwright-run.log ] && tail -c 20000 playwright-run.log || echo "(no run log — suite did not reach the Playwright step)"
            echo '```'
            find test-results -name '*error-context*' 2>/dev/null | head -20 | while read -r f; do
              echo "<details><summary>${f}</summary>"; echo; echo '```'
              head -c 8000 "$f"
              echo; echo '```'; echo '</details>'; echo
            done
          } | perl -pe '
            for my $v ($ENV{E2E_USER_PASSWORD}, $ENV{E2E_SUPABASE_SERVICE_ROLE_KEY}, $ENV{SECRET_ANON}) {
              next unless defined $v && length $v >= 6;
              my $q = quotemeta($v);
              s/$q/[REDACTED]/g;
            }
          ' > e2e-comment.md

      - name: Publish redacted E2E report to PR #41
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("e2e-comment.md")) { console.log("no e2e-comment.md"); return; }
            let body = fs.readFileSync("e2e-comment.md", "utf8");
            if (body.length > 60000) body = body.slice(0, 60000) + "\n…TRUNCATED…";
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 41, body });

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            playwright-run.log
            playwright-report/
            test-results/
          if-no-files-found: warn
